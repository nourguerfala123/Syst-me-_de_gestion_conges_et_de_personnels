<div class="container mt-5">
  <div class="card shadow p-4">
    <h2 class="text-center mb-4">Supprimer un employé</h2>

    <form (ngSubmit)="supprimerEmploye()">

      <div class="mb-3">
        <label for="id" class="form-label">ID de l'employé</label>
        <input
          type="number"
          class="form-control"
          id="id"
          name="id"
          [(ngModel)]="idEmploye"
          required>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-danger">
          Supprimer
        </button>
      </div>

    </form>

    <div *ngIf="message" class="alert alert-info mt-3">
      {{ message }}
    </div>

  </div>
</div>
